trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Azure DevOps service connection
  azureSubscription: 'HealthConnect-Azure'

  # Azure Container Registry
  acrName: 'ritikahealthconnectacr'
  acrLoginServer: 'ritikahealthconnectacr.azurecr.io'

  # Docker image
  imageRepository: 'healthconnect-api'
  imageTag: '$(Build.BuildId)'

  # Java
  javaVersion: '17'

  # Security scanning
  trivyVersion: '0.58.1'

  # AKS
  aksResourceGroup: 'rg-healthconnect-acr'
  aksClusterName: 'aks-healthconnect-ritika'
  kubernetesNamespace: 'healthconnect'

  # Helm
  helmReleaseName: 'healthconnect'
  helmChartPath: 'kubernetes/helm/healthconnect'


# ============================================================
# STAGE 1 - BUILD
# ============================================================

stages:

- stage: Build
  displayName: 'Build Stage'

  jobs:

  - job: BuildJob
    displayName: 'Compile Spring Boot Application'

    steps:

    - checkout: self

    - task: JavaToolInstaller@0
      displayName: 'Install Java 17'
      inputs:
        versionSpec: '$(javaVersion)'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Cache@2
      displayName: 'Restore Maven Cache'
      inputs:
        key: 'maven | "$(Agent.OS)" | app/healthconnect-api/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)"
        path: $(HOME)/.m2/repository

    - script: |
        cd app/healthconnect-api
        chmod +x mvnw
        ./mvnw clean compile
      displayName: 'Compile Application'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifact'
      inputs:
        PathtoPublish: 'app/healthconnect-api/target'
        ArtifactName: 'spring-build'


# ============================================================
# STAGE 2 - TEST
# ============================================================

- stage: Test
  displayName: 'Test Stage'

  dependsOn: Build

  jobs:

  - job: TestJob
    displayName: 'Run Unit and Integration Tests'

    steps:

    - checkout: self

    - task: JavaToolInstaller@0
      displayName: 'Install Java 17'
      inputs:
        versionSpec: '$(javaVersion)'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Cache@2
      displayName: 'Restore Maven Cache'
      inputs:
        key: 'maven | "$(Agent.OS)" | app/healthconnect-api/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)"
        path: $(HOME)/.m2/repository

    - script: |
        cd app/healthconnect-api
        chmod +x mvnw
        ./mvnw clean verify
      displayName: 'Run Unit and Integration Tests'

    - task: PublishTestResults@2
      displayName: 'Publish JUnit Test Results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        failTaskOnFailedTests: true
        testRunTitle: 'HealthConnect Test Results'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish JaCoCo Coverage'
      condition: succeededOrFailed()
      inputs:
        codeCoverageTool: 'JaCoCo'
        summaryFileLocation: 'app/healthconnect-api/target/site/jacoco/jacoco.xml'
        reportDirectory: 'app/healthconnect-api/target/site/jacoco'


# ============================================================
# STAGE 3 - DOCKER BUILD
# ============================================================

- stage: Docker
  displayName: 'Docker Build Stage'

  dependsOn: Test

  jobs:

  - job: DockerJob
    displayName: 'Build Docker Image'

    steps:

    - checkout: self

    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: 'build'
        Dockerfile: 'app/healthconnect-api/Dockerfile'
        repository: 'healthconnect-api'
        tags: |
          latest
          $(Build.BuildId)

    - script: |
        echo "Creating Docker image artifact directory..."

        mkdir -p "$(Build.ArtifactStagingDirectory)/docker-image"

        echo "Saving Docker image..."

        docker save healthconnect-api:latest \
          -o "$(Build.ArtifactStagingDirectory)/docker-image/healthconnect-api.tar"

        echo "Docker image saved:"
        ls -lh "$(Build.ArtifactStagingDirectory)/docker-image/healthconnect-api.tar"
      displayName: 'Save Docker Image'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Docker Image Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/docker-image'
        artifact: 'docker-image'


# ============================================================
# STAGE 4 - SECURITY SCAN
# ============================================================

- stage: Security
  displayName: 'Security Scan'

  dependsOn: Docker

  jobs:

  - job: TrivyScan
    displayName: 'Scan Docker Image'

    steps:

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Docker Image'
      inputs:
        buildType: 'current'
        artifactName: 'docker-image'
        targetPath: '$(Pipeline.Workspace)/docker-image'

    - script: |
        echo "Loading Docker image..."

        docker load \
          -i "$(Pipeline.Workspace)/docker-image/healthconnect-api.tar"

        echo "Docker images:"
        docker images

        echo "Verifying image:"
        docker image inspect healthconnect-api:latest
      displayName: 'Load Docker Image'

    - script: |
        echo "Pulling Trivy image..."

        docker pull aquasec/trivy:$(trivyVersion)

        echo "Trivy version:"

        docker run --rm \
          aquasec/trivy:$(trivyVersion) \
          --version
      displayName: 'Prepare Trivy'

    - script: |
        echo "Scanning HealthConnect Docker image..."

        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:$(trivyVersion) \
          image \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          healthconnect-api:latest
      displayName: 'Scan Docker Image'


# ============================================================
# STAGE 5 - PUSH IMAGE TO ACR
# ============================================================

- stage: PushImage
  displayName: 'Push Image to Azure Container Registry'

  dependsOn: Security

  jobs:

  - job: PushJob
    displayName: 'Push Docker Image to ACR'

    steps:

    - checkout: self

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Docker Image'
      inputs:
        buildType: 'current'
        artifactName: 'docker-image'
        targetPath: '$(Pipeline.Workspace)/docker-image'

    - script: |
        echo "Loading Docker image..."

        docker load \
          -i "$(Pipeline.Workspace)/docker-image/healthconnect-api.tar"

        echo "Docker images:"
        docker images

        docker image inspect healthconnect-api:latest
      displayName: 'Load Docker Image'

    - task: AzureCLI@2
      displayName: 'Login to Azure Container Registry'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |

          echo "Logging into Azure..."

          az account show

          echo "Logging into ACR..."

          az acr login \
            --name "$(acrName)"

    - script: |
        echo "Tagging Docker image..."

        docker tag \
          healthconnect-api:latest \
          $(acrLoginServer)/$(imageRepository):$(imageTag)

        echo "Image:"
        echo "$(acrLoginServer)/$(imageRepository):$(imageTag)"
      displayName: 'Tag Image for ACR'

    - script: |
        echo "Pushing image to Azure Container Registry..."

        docker push \
          $(acrLoginServer)/$(imageRepository):$(imageTag)

        echo "Image successfully pushed."
      displayName: 'Push Image to ACR'


# ============================================================
# STAGE 6 - BLUE-GREEN DEPLOYMENT
# ============================================================

- stage: Deploy
  displayName: 'Blue-Green Deployment to AKS'
  dependsOn: PushImage

  jobs:

  - deployment: DeployGreen
    displayName: 'Deploy Green Environment'

    environment: 'healthconnect-aks'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          # ------------------------------------------------
          # Get AKS credentials
          # ------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Get AKS Credentials'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |

                az aks get-credentials \
                  --resource-group "$(aksResourceGroup)" \
                  --name "$(aksClusterName)" \
                  --overwrite-existing

                kubectl get nodes


          # ------------------------------------------------
          # Deploy NEW GREEN version
          # ------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Deploy Green'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |

                GREEN_NAME="healthconnect-api-green-$(Build.BuildId)"

                echo "Green deployment: $GREEN_NAME"
                echo "Image: $(acrLoginServer)/$(imageRepository):$(imageTag)"

                cat > green-deployment.yaml <<EOF
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: ${GREEN_NAME}
                  namespace: $(kubernetesNamespace)
                  labels:
                    app.kubernetes.io/name: healthconnect
                    app.kubernetes.io/instance: healthconnect-green
                    deployment-color: green
                    deployment-version: "$(Build.BuildId)"
                spec:
                  replicas: 2
                  strategy:
                    type: RollingUpdate
                    rollingUpdate:
                      maxUnavailable: 0
                      maxSurge: 1
                  selector:
                    matchLabels:
                      app.kubernetes.io/name: healthconnect
                      app.kubernetes.io/instance: healthconnect-green
                      deployment-version: "$(Build.BuildId)"
                  template:
                    metadata:
                      labels:
                        app.kubernetes.io/name: healthconnect
                        app.kubernetes.io/instance: healthconnect-green
                        deployment-color: green
                        deployment-version: "$(Build.BuildId)"
                    spec:
                      containers:
                      - name: healthconnect-api
                        image: $(acrLoginServer)/$(imageRepository):$(imageTag)
                        imagePullPolicy: IfNotPresent
                        ports:
                        - name: http
                          containerPort: 8080
                          protocol: TCP
                        env:
                        - name: DB_URL
                          value: jdbc:postgresql://healthconnect-postgres:5432/healthconnect
                        - name: DB_USERNAME
                          valueFrom:
                            secretKeyRef:
                              name: postgres-secret
                              key: POSTGRES_USER
                        - name: DB_PASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: postgres-secret
                              key: POSTGRES_PASSWORD
                        resources:
                          requests:
                            cpu: 100m
                            memory: 256Mi
                          limits:
                            cpu: 500m
                            memory: 512Mi
                        readinessProbe:
                          httpGet:
                            path: /actuator/health
                            port: 8080
                          initialDelaySeconds: 30
                          periodSeconds: 10
                        livenessProbe:
                          httpGet:
                            path: /actuator/health
                            port: 8080
                          initialDelaySeconds: 60
                          periodSeconds: 20
                EOF

                kubectl apply -f green-deployment.yaml

                kubectl rollout status \
                  deployment/${GREEN_NAME} \
                  --namespace "$(kubernetesNamespace)" \
                  --timeout=5m

                echo ""
                echo "Green deployment:"
                kubectl get deployment ${GREEN_NAME} \
                  --namespace "$(kubernetesNamespace)"

                echo ""
                echo "Green pods:"
                kubectl get pods \
                  --namespace "$(kubernetesNamespace)" \
                  -l deployment-version="$(Build.BuildId)"


          # ------------------------------------------------
          # Create temporary Green service
          # ------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Validate Green Environment'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |

                GREEN_NAME="healthconnect-api-green-$(Build.BuildId)"

                cat > green-service.yaml <<EOF
                apiVersion: v1
                kind: Service
                metadata:
                  name: ${GREEN_NAME}-svc
                  namespace: $(kubernetesNamespace)
                spec:
                  type: ClusterIP
                  selector:
                    app.kubernetes.io/name: healthconnect
                    app.kubernetes.io/instance: healthconnect-green
                    deployment-version: "$(Build.BuildId)"
                  ports:
                  - protocol: TCP
                    port: 80
                    targetPort: 8080
                EOF

                kubectl apply -f green-service.yaml

                echo "Testing Green internally..."

                kubectl run green-health-check-$(Build.BuildId) \
                  --namespace "$(kubernetesNamespace)" \
                  --rm \
                  -i \
                  --restart=Never \
                  --image=curlimages/curl \
                  -- \
                  curl -f \
                  "http://${GREEN_NAME}-svc.$(kubernetesNamespace).svc.cluster.local/actuator/health"

                echo ""
                echo "GREEN INTERNAL HEALTH CHECK PASSED."


          # ------------------------------------------------
          # Switch production traffic to GREEN
          # ------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Switch Traffic to Green'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |

                echo "Switching production traffic to GREEN..."

                kubectl patch service healthconnect-api \
                  --namespace "$(kubernetesNamespace)" \
                  --type merge \
                  -p '{
                    "spec": {
                      "selector": {
                        "app.kubernetes.io/name": "healthconnect",
                        "app.kubernetes.io/instance": "healthconnect-green",
                        "deployment-version": "$(Build.BuildId)"
                      }
                    }
                  }'

                echo ""
                echo "Production Service now points to GREEN."

                kubectl get service healthconnect-api \
                  --namespace "$(kubernetesNamespace)"

                echo ""
                echo "Production endpoints:"
                kubectl get endpoints healthconnect-api \
                  --namespace "$(kubernetesNamespace)"


          # ------------------------------------------------
          # Public smoke test + automatic rollback
          # ------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Smoke Test and Automatic Rollback'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |

                echo "Waiting for LoadBalancer..."

                sleep 15

                PUBLIC_IP=$(kubectl get service healthconnect-api \
                  --namespace "$(kubernetesNamespace)" \
                  -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

                echo "Public IP: $PUBLIC_IP"

                echo ""
                echo "Running production health check..."

                if curl -f \
                  --retry 5 \
                  --retry-delay 5 \
                  "http://$PUBLIC_IP/actuator/health"
                then

                  echo ""
                  echo "======================================"
                  echo " GREEN DEPLOYMENT SUCCESSFUL"
                  echo " Production traffic is on GREEN"
                  echo "======================================"

                else

                  echo ""
                  echo "======================================"
                  echo " GREEN HEALTH CHECK FAILED"
                  echo " ROLLING BACK TO BLUE"
                  echo "======================================"

                  kubectl patch service healthconnect-api \
                    --namespace "$(kubernetesNamespace)" \
                    --type merge \
                    -p '{
                      "spec": {
                        "selector": {
                          "app.kubernetes.io/name": "healthconnect",
                          "app.kubernetes.io/instance": "healthconnect"
                        }
                      }
                    }'

                  echo "Traffic switched back to BLUE."

                  kubectl get endpoints healthconnect-api \
                    --namespace "$(kubernetesNamespace)"

                  exit 1

                fi


# ============================================================
# STAGE 7 - DEPLOYMENT VERIFICATION
# ============================================================

- stage: Verify
  displayName: 'Verify Blue-Green Deployment'
  dependsOn: Deploy

  jobs:

  - job: VerifyDeployment
    displayName: 'Verify Production'

    steps:

    - task: AzureCLI@2
      displayName: 'Verify Production Deployment'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |

          az aks get-credentials \
            --resource-group "$(aksResourceGroup)" \
            --name "$(aksClusterName)" \
            --overwrite-existing

          echo ""
          echo "======================================"
          echo " PRODUCTION DEPLOYMENT"
          echo "======================================"

          kubectl get deployment healthconnect-api \
            --namespace "$(kubernetesNamespace)"

          echo ""
          echo "=== BLUE PODS ==="

          kubectl get pods \
            --namespace "$(kubernetesNamespace)" \
            -l app.kubernetes.io/instance=healthconnect

          echo ""
          echo "=== GREEN PODS ==="

          kubectl get pods \
            --namespace "$(kubernetesNamespace)" \
            -l app.kubernetes.io/instance=healthconnect-green

          echo ""
          echo "=== PRODUCTION SERVICE ==="

          kubectl get service healthconnect-api \
            --namespace "$(kubernetesNamespace)"

          echo ""
          echo "=== PRODUCTION ENDPOINTS ==="

          kubectl get endpoints healthconnect-api \
            --namespace "$(kubernetesNamespace)"

          echo ""
          echo "=== FINAL HEALTH CHECK ==="

          PUBLIC_IP=$(kubectl get service healthconnect-api \
            --namespace "$(kubernetesNamespace)" \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          curl -f \
            --retry 5 \
            --retry-delay 5 \
            "http://$PUBLIC_IP/actuator/health"

          echo ""
          echo "======================================"
          echo " BLUE-GREEN VERIFICATION SUCCESSFUL"
          echo "======================================"