trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  javaVersion: '17'

  azureSubscription: 'azure-healthconnect-sc'

  acrName: 'ritikahealthconnectacr'
  acrLoginServer: 'ritikahealthconnectacr.azurecr.io'

  imageRepository: 'healthconnect-api'
  imageTag: '$(Build.BuildId)'

  trivyVersion: '0.58.1'


# ============================================================
# STAGE 1 - BUILD
# ============================================================

stages:

- stage: Build
  displayName: 'Build Stage'

  jobs:
  - job: BuildJob
    displayName: 'Compile Spring Boot Application'

    steps:

    - checkout: self

    - task: JavaToolInstaller@0
      displayName: 'Install Java 17'
      inputs:
        versionSpec: '$(javaVersion)'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Cache@2
      displayName: 'Restore Maven Cache'
      inputs:
        key: 'maven | "$(Agent.OS)" | app/healthconnect-api/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)"
        path: $(HOME)/.m2/repository

    - script: |
        cd app/healthconnect-api
        chmod +x mvnw
        ./mvnw clean compile
      displayName: 'Compile Application'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifact'
      inputs:
        PathtoPublish: 'app/healthconnect-api/target'
        ArtifactName: 'spring-build'


# ============================================================
# STAGE 2 - TEST
# ============================================================

- stage: Test
  displayName: 'Test Stage'

  dependsOn: Build

  jobs:
  - job: TestJob
    displayName: 'Run Unit and Integration Tests'

    steps:

    - checkout: self

    - task: JavaToolInstaller@0
      displayName: 'Install Java 17'
      inputs:
        versionSpec: '$(javaVersion)'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Cache@2
      displayName: 'Restore Maven Cache'
      inputs:
        key: 'maven | "$(Agent.OS)" | app/healthconnect-api/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)"
        path: $(HOME)/.m2/repository

    - script: |
        cd app/healthconnect-api
        chmod +x mvnw
        ./mvnw clean verify
      displayName: 'Run Unit and Integration Tests'

    - task: PublishTestResults@2
      displayName: 'Publish JUnit Test Results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        failTaskOnFailedTests: true
        testRunTitle: 'HealthConnect Test Results'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish JaCoCo Coverage'
      condition: succeededOrFailed()
      inputs:
        codeCoverageTool: 'JaCoCo'
        summaryFileLocation: 'app/healthconnect-api/target/site/jacoco/jacoco.xml'
        reportDirectory: 'app/healthconnect-api/target/site/jacoco'


# ============================================================
# STAGE 3 - DOCKER BUILD
# ============================================================

- stage: Docker
  displayName: 'Docker Stage'

  dependsOn: Test

  jobs:
  - job: DockerJob
    displayName: 'Build Docker Image'

    steps:

    - checkout: self

    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: 'build'
        Dockerfile: 'app/healthconnect-api/Dockerfile'
        repository: 'healthconnect-api'
        tags: |
          latest
          $(Build.BuildId)

    # --------------------------------------------------------
    # Save Docker image as a TAR file
    # --------------------------------------------------------

    - script: |
        echo "Creating Docker image artifact directory..."

        mkdir -p "$(Build.ArtifactStagingDirectory)/docker-image"

        echo "Saving Docker image..."

        docker save healthconnect-api:latest \
          -o "$(Build.ArtifactStagingDirectory)/docker-image/healthconnect-api.tar"

        echo "Docker image saved:"
        ls -lh "$(Build.ArtifactStagingDirectory)/docker-image/healthconnect-api.tar"
      displayName: 'Save Docker Image'

    # --------------------------------------------------------
    # Publish TAR as Pipeline Artifact
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Docker Image Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/docker-image'
        artifact: 'docker-image'


# ============================================================
# STAGE 4 - SECURITY SCAN
# ============================================================

- stage: Security
  displayName: 'Security Scan'

  dependsOn: Docker

  jobs:
  - job: TrivyScan
    displayName: 'Scan Docker Image'

    steps:

    # --------------------------------------------------------
    # Download Docker image artifact
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Docker Image'
      inputs:
        buildType: 'current'
        artifactName: 'docker-image'
        targetPath: '$(Pipeline.Workspace)/docker-image'

    # --------------------------------------------------------
    # Load Docker image
    # --------------------------------------------------------

    - script: |
        echo "Downloaded Docker image files:"

        find "$(Pipeline.Workspace)/docker-image" \
          -maxdepth 3 \
          -type f \
          -print

        echo "Loading Docker image..."

        docker load \
          -i "$(Pipeline.Workspace)/docker-image/healthconnect-api.tar"

        echo "Docker images after loading:"

        docker images

        echo "Verifying image..."

        docker image inspect healthconnect-api:latest
      displayName: 'Load Docker Image'

    # --------------------------------------------------------
    # Prepare Trivy
    # --------------------------------------------------------

    - script: |
        echo "Pulling Trivy image..."

        docker pull aquasec/trivy:$(trivyVersion)

        echo "Trivy version:"

        docker run --rm \
          aquasec/trivy:$(trivyVersion) \
          --version
      displayName: 'Prepare Trivy'

    # --------------------------------------------------------
    # Trivy vulnerability scan
    # --------------------------------------------------------

    - script: |
        echo "Scanning HealthConnect Docker image..."

        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:$(trivyVersion) \
          image \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          healthconnect-api:latest
      displayName: 'Scan Docker Image'


# ============================================================
# STAGE 5 - PUSH IMAGE TO ACR
# ============================================================

- stage: PushImage
  displayName: 'Push Image to Azure Container Registry'

  dependsOn: Security

  jobs:
  - job: PushJob
    displayName: 'Push Docker Image to ACR'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Download the SAME Docker image that was scanned
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Docker Image'
      inputs:
        buildType: 'current'
        artifactName: 'docker-image'
        targetPath: '$(Pipeline.Workspace)/docker-image'

    # --------------------------------------------------------
    # Load the SAME image scanned by Trivy
    # --------------------------------------------------------

    - script: |
        echo "Downloaded Docker image files:"

        find "$(Pipeline.Workspace)/docker-image" \
          -maxdepth 3 \
          -type f \
          -print

        echo "Loading Docker image..."

        docker load \
          -i "$(Pipeline.Workspace)/docker-image/healthconnect-api.tar"

        echo "Docker images:"

        docker images

        echo "Verifying image..."

        docker image inspect healthconnect-api:latest
      displayName: 'Load Docker Image'

    # --------------------------------------------------------
    # Login to Azure Container Registry
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Login to Azure Container Registry'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Logging into Azure Container Registry..."

          az acr login \
            --name "$(acrName)"

    # --------------------------------------------------------
    # Tag image for ACR
    # --------------------------------------------------------

    - script: |
        echo "Tagging Docker image..."

        docker tag \
          healthconnect-api:latest \
          $(acrLoginServer)/$(imageRepository):$(imageTag)

        echo "Image tags:"

        docker images
      displayName: 'Tag Image for ACR'

    # --------------------------------------------------------
    # Push image to ACR
    # --------------------------------------------------------

    - script: |
        echo "Pushing image to Azure Container Registry..."

        docker push \
          $(acrLoginServer)/$(imageRepository):$(imageTag)

        echo "Image successfully pushed."

        echo "Image:"
        echo "$(acrLoginServer)/$(imageRepository):$(imageTag)"
      displayName: 'Push Image to ACR'


# ============================================================
# STAGE 6 - DEPLOY
# ============================================================

- stage: Deploy
  displayName: 'Deploy to Azure App Service'

  dependsOn: PushImage

  jobs:

  - deployment: DeployWebApp
    displayName: 'Deploy HealthConnect'

    environment: 'healthconnect-dev'

    strategy:
      runOnce:
        deploy:

          steps:

          - task: AzureWebAppContainer@1
            displayName: 'Deploy Docker Image'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: 'healthconnect-ritika'
              containers: '$(acrLoginServer)/$(imageRepository):$(imageTag)'