databaseChangeLog:
  - changeSet:
      id: create-claims-table
      author: healthconnect

      changes:
        - createTable:
            tableName: claims

            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: claim_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: hospital_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: claim_amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: claim_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: diagnosis
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: remarks
                  type: VARCHAR(500)

              - column:
                  name: enrollment_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: claims
            baseColumnNames: enrollment_id
            referencedTableName: enrollments
            referencedColumnNames: id
            constraintName: fk_claim_enrollment