databaseChangeLog:
  - changeSet:
      id: create-benefits-table
      author: healthconnect

      changes:
        - createTable:
            tableName: benefits

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: benefit_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: benefit_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: coverage_amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: is_active
                  type: BOOLEAN
                  constraints:
                    nullable: false

              - column:
                  name: enrollment_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: benefits
            baseColumnNames: enrollment_id
            referencedTableName: enrollments
            referencedColumnNames: id
            constraintName: fk_benefits_enrollment