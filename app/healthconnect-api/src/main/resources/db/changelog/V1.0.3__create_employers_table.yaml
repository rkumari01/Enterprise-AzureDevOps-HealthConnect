databaseChangeLog:
  - changeSet:
      id: V1.0.3-create-employers-table
      author: ritik

      changes:
        - createTable:
            tableName: employers
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employer_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: company_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: contact_person
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: contact_email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: phone_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false