databaseChangeLog:
  - changeSet:
      id: V1.0.2-create-users-table
      author: ritika

      changes:
        - createTable:
            tableName: users

            columns:
                - column:
                    name: id
                    type: BIGSERIAL
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: employee_id
                    type: VARCHAR(20)
                    constraints:
                      nullable: false
                      unique: true

                - column:
                    name: first_name
                    type: VARCHAR(100)
                    constraints:
                      nullable: false

                - column:
                    name: last_name
                    type: VARCHAR(100)
                    constraints:
                      nullable: false

                - column:
                    name: email
                    type: VARCHAR(100)
                    constraints:
                      nullable: false
                      unique: true

                - column:
                    name: password
                    type: VARCHAR(255)
                    constraints:
                      nullable: false

                - column:
                    name: role_id
                    type: BIGINT
                    constraints:
                      nullable: false

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_users_roles