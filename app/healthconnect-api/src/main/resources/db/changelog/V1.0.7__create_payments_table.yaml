databaseChangeLog:
  - changeSet:
      id: create-payments-table
      author: healthconnect

      changes:
        - createTable:
            tableName: payments

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: payment_reference
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: payment_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: payment_method
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: claim_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: claim_id
            referencedTableName: claims
            referencedColumnNames: id
            constraintName: fk_payments_claim