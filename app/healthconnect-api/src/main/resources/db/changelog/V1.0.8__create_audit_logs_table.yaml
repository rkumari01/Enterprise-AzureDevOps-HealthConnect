databaseChangeLog:
  - changeSet:
      id: create-audit-logs
      author: healthconnect

      changes:

        - createTable:
            tableName: audit_logs

            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: action
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: entity_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: entity_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: performed_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false