databaseChangeLog:
  - changeSet:
      id: create-enrollments-table
      author: healthconnect

      changes:
        - createTable:
            tableName: enrollments

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: member_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: plan_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: coverage_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: effective_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: employer_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: enrollments
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_enrollment_user

        - addForeignKeyConstraint:
            baseTableName: enrollments
            baseColumnNames: employer_id
            referencedTableName: employers
            referencedColumnNames: id
            constraintName: fk_enrollment_employer