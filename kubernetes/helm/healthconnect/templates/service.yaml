apiVersion: v1
kind: Service

metadata:
  name: {{ include "healthconnect.fullname" . }}
  namespace: healthconnect

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "healthconnect.selectorLabels" . | nindent 4 }}

  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}