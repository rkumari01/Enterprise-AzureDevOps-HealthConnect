apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "healthconnect.fullname" . }}-test-connection"
  labels:
    {{- include "healthconnect.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test

spec:
  containers:
    - name: wget
      image: busybox
      command:
        - wget
      args:
        - "{{ include "healthconnect.fullname" . }}:{{ .Values.service.port }}"

  restartPolicy: Never